<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StageComms">
    
    <title>StageComms - Church Production Control</title>
    
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="login-screen" class="screen">
            <div class="login-container">
                <h1>StageComms</h1>
                <p class="subtitle">Church Production Control</p>
                
                <div class="login-form">
                    <label for="username-input">Your Name</label>
                    <input 
                        type="text" 
                        id="username-input" 
                        placeholder="e.g., Camera 1" 
                        maxlength="50"
                        autocomplete="off"
                    >
                    
                    <button id="login-btn" class="btn btn-primary">
                        Enter
                    </button>
                </div>
            </div>
        </div>

    <!-- Main Application Screen -->
    <div id="main-screen" class="screen hidden">
        <!-- Top Banner -->
        <div class="top-banner">
            <div id="connection-status" class="connection-status">
                <span id="connection-dot" class="status-dot online"></span>
                <span id="connection-text">Connected</span>
            </div>
            
            <div class="last-cue">
                <div id="last-cue-content">
                    Waiting for cues...
                </div>
            </div>
            
            <button id="test-audio-btn" class="btn btn-icon" title="Test audio">
                <span>🔊</span>
            </button>
            
            <div class="hamburger-menu">
                <button id="menu-toggle" class="btn btn-icon" title="Menu">
                    <span>☰</span>
                </button>
                <div id="menu-dropdown" class="menu-dropdown hidden">
                    <button id="menu-users" class="menu-item">👥 Connected Users</button>
                    <button id="menu-history" class="menu-item">📋 Message History</button>
                    <button id="menu-settings" class="menu-item">⚙️ Settings</button>
                    <div class="menu-divider"></div>
                    <div id="menu-username" class="menu-username">
                        <span id="current-username"></span>
                        <span class="status-dot online"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Cue Grid -->
            <div id="cue-grid" class="cue-grid">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <!-- Temporary Message Bar (Footer) -->
        <div class="message-bar">
            <textarea id="temporary-message-input" placeholder="Type a temporary message to read aloud..." maxlength="500" rows="2"></textarea>
            <button id="send-temporary-message-btn" class="btn btn-primary">Send</button>
        </div>

        <!-- Full Screen Cue Display -->
        <div id="cue-overlay" class="cue-overlay hidden">
            <div class="cue-content">
                <h1 id="overlay-message">CUE</h1>
                <p id="overlay-sender" class="sender-info"></p>
            </div>
        </div>

        <!-- Connected Users Panel -->
        <div id="users-panel" class="side-panel users-panel hidden">
            <div class="panel-header">
                <h2>Connected Users</h2>
                <button class="btn btn-icon close-btn">×</button>
            </div>
            <div id="users-list" class="users-list">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <!-- Message History -->
        <div id="history-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Message History</h2>
                    <button class="btn btn-icon close-btn">×</button>
                </div>
                <div class="modal-filters">
                    <input type="text" id="history-search" placeholder="Search...">
                    <select id="history-filter-user">
                        <option value="">All Users</option>
                    </select>
                    <select id="history-filter-category">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="history-actions">
                    <button id="history-last-24h-btn" class="btn btn-secondary">Last 24 Hours</button>
                    <button id="history-all-btn" class="btn btn-secondary">All Messages</button>
                </div>
                <div id="history-list" class="history-list">
                    <!-- Populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Custom Message Dialog -->
        <div id="custom-message-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Custom Message</h2>
                    <button class="btn btn-icon close-btn">×</button>
                </div>
                <textarea 
                    id="custom-message-input" 
                    placeholder="Type your message..." 
                    maxlength="500"
                    rows="4"
                ></textarea>
                <div class="char-count">
                    <span id="char-count">0</span>/500
                </div>
                <button id="send-custom-btn" class="btn btn-primary">
                    Send
                </button>
            </div>
        </div>

        <!-- Settings Panel -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button class="btn btn-icon close-btn">×</button>
                </div>
                <div class="settings-list">
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="sound-enabled" checked>
                            Enable Sounds
                        </label>
                    </div>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="vibration-enabled" checked>
                            Enable Vibration
                        </label>
                    </div>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="full-screen-cues" checked>
                            Full Screen Cues
                        </label>
                    </div>
                    <div class="setting-item">
                        <label for="notification-volume">Notification Volume</label>
                        <input type="range" id="notification-volume" min="0" max="100" value="80">
                    </div>
                </div>
                <button id="logout-btn" class="btn btn-secondary">
                    Logout
                </button>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="loading-spinner hidden">
            <div class="spinner"></div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
