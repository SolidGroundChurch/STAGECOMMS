<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageComms Admin - Settings & Configuration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0F172A;
            color: #FFFFFF;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 2rem;
            color: #3B82F6;
        }

        h2 {
            margin-top: 2rem;
            margin-bottom: 1rem;
            font-size: 1.25rem;
            color: #60A5FA;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: #1E293B;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 1.5rem;
        }

        .card h3 {
            margin-bottom: 1rem;
            color: #93C5FD;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #CBD5E1;
        }

        input[type="text"],
        input[type="color"],
        select,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #334155;
            border-radius: 8px;
            background: #0F172A;
            color: #FFFFFF;
            font-size: 1rem;
        }

        input[type="text"]:focus,
        input[type="color"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 150ms;
            min-height: 44px;
        }

        .btn-primary {
            background: #3B82F6;
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: #2563EB;
        }

        .btn-secondary {
            background: #334155;
            color: #FFFFFF;
            margin-right: 0.5rem;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .btn-danger {
            background: #EF4444;
            color: white;
        }

        .btn-danger:hover {
            background: #DC2626;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-online {
            background: #10B981;
            color: white;
        }

        .status-offline {
            background: #6B7280;
            color: white;
        }

        .color-preview {
            display: inline-block;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            margin-left: 0.5rem;
            border: 2px solid #334155;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat {
            background: #1E293B;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: #3B82F6;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.875rem;
            color: #94A3B8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 2px solid #334155;
        }

        th {
            background: #1E293B;
            font-weight: 600;
            color: #93C5FD;
        }

        tr:hover {
            background: #1E293B;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .message.success {
            background: #10B981;
            color: white;
        }

        .message.error {
            background: #EF4444;
            color: white;
        }

        .section {
            margin-bottom: 3rem;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            table {
                font-size: 0.875rem;
            }

            th, td {
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ StageComms Admin Panel</h1>

        <div id="message-container"></div>

        <!-- Statistics -->
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="total-cues">0</div>
                <div class="stat-label">Total Cues</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="enabled-cues">0</div>
                <div class="stat-label">Enabled Cues</div>
            </div>
            <div class="stat">                <div class="stat-value" id="total-messages">0</div>
                <div class="stat-label">Total Messages</div>
            </div>
            <div class="stat-card">                <div class="stat-value" id="active-users">0</div>
                <div class="stat-label">Active Users</div>
            </div>
        </div>

        <!-- Cue Management -->
        <div class="section">
            <h2>Cue Management</h2>

            <div class="grid">
                <div class="card">
                    <h3>Create New Cue</h3>
                    <div class="form-group">
                        <label>Display Name</label>
                        <input type="text" id="cue-name" placeholder="e.g., Next Speaker">
                    </div>
                    <div class="form-group">
                        <label>Spoken Text (Optional)</label>
                        <textarea id="cue-spoken" placeholder="Text to be spoken" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" id="cue-category" placeholder="e.g., General">
                    </div>
                    <div class="form-group">
                        <label>Button Colour</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="color" id="cue-colour" value="#3B82F6">
                            <span class="color-preview" id="colour-preview"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Icon</label>
                        <select id="cue-icon">
                            <option value="bell">🔔 Bell</option>
                            <option value="go">▶️ Go</option>
                            <option value="stop">⏹️ Stop</option>
                            <option value="speaker">🎤 Speaker</option>
                            <option value="music">🎵 Music</option>
                            <option value="light">💡 Light</option>
                            <option value="camera">📷 Camera</option>
                            <option value="prayer">🙏 Prayer</option>
                            <option value="offering">💰 Offering</option>
                            <option value="announcement">📢 Announcement</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Audio Mode</label>
                        <select id="cue-audio-mode">
                            <option value="automatic">Automatic (MP3 then TTS)</option>
                            <option value="mp3_only">MP3 Only</option>
                            <option value="tts_only">Text-to-Speech Only</option>
                            <option value="silent">Silent</option>
                        </select>
                    </div>
                    <button class="btn-primary" onclick="createCue()">Create Cue</button>
                </div>

                <div class="card">
                    <h3>Upload Cue Audio</h3>
                    <div class="form-group">
                        <label>Select Cue</label>
                        <select id="cue-select">
                            <option value="">-- Loading cues --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Audio File (MP3, WAV, OGG, M4A)</label>
                        <input type="file" id="audio-file" accept="audio/*">
                    </div>
                    <button class="btn-primary" onclick="uploadAudio()">Upload Audio</button>
                </div>
            </div>

            <h3 style="margin-top: 2rem; margin-bottom: 1rem;">Existing Cues</h3>
            <table id="cues-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Audio Mode</th>
                        <th>Enabled</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="cues-tbody">
                    <tr><td colspan="5" style="text-align: center; color: #94A3B8;">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Active Users -->
        <div class="section">
            <h2>Connected Users</h2>
            <table id="users-table">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Connected At</th>
                        <th>Last Seen</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <tr><td colspan="4" style="text-align: center; color: #94A3B8;">No users connected</td></tr>
                </tbody>
            </table>
        </div>

        <!-- System -->
        <div class="section">
            <h2>System</h2>
            <div class="button-group">
                <button class="btn-secondary" onclick="checkHealth()">Check Health</button>
                <button class="btn-secondary" onclick="refreshStats()">Refresh Stats</button>
                <button class="btn-secondary" onclick="createBackup()">Create Backup</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        async function loadStats() {
            try {
                const statsRes = await fetch(`${API_BASE}/admin/stats`);
                const stats = await statsRes.json();
                
                document.getElementById('total-cues').textContent = stats.total_cues;
                document.getElementById('enabled-cues').textContent = stats.enabled_cues;
                document.getElementById('total-messages').textContent = stats.total_messages;
                
                const usersRes = await fetch(`${API_BASE}/users`);
                const users = await usersRes.json();
                document.getElementById('active-users').textContent = users.length;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadCues() {
            try {
                const res = await fetch(`${API_BASE}/cues?enabled_only=false`);
                if (!res.ok) {
                    throw new Error(`API returned ${res.status}: ${res.statusText}`);
                }
                const cues = await res.json();

                // Populate select
                const select = document.getElementById('cue-select');
                select.innerHTML = '<option value="">-- Select a cue --</option>';
                cues.forEach(cue => {
                    const option = document.createElement('option');
                    option.value = cue.id;
                    option.textContent = cue.display_name;
                    select.appendChild(option);
                });

                // Populate table
                const tbody = document.getElementById('cues-tbody');
                tbody.innerHTML = '';
                
                if (cues.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #94A3B8;">No cues found</td></tr>';
                    return;
                }
                
                cues.forEach(cue => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${cue.display_name}</strong></td>
                        <td>${cue.category}</td>
                        <td>${cue.audio_mode}</td>
                        <td>${cue.enabled ? '<span class="status-badge status-online">Enabled</span>' : '<span class="status-badge status-offline">Disabled</span>'}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-secondary" onclick="editCue(${cue.id})">Edit</button>
                                <button class="btn-danger" onclick="deleteCue(${cue.id})">Delete</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading cues:', error);
                const tbody = document.getElementById('cues-tbody');
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #EF4444;">Error: ${error.message}</td></tr>`;
                showMessage(`Error loading cues: ${error.message}`, 'error');
            }
        }

        async function loadUsers() {
            try {
                const res = await fetch(`${API_BASE}/users`);
                const users = await res.json();

                const tbody = document.getElementById('users-tbody');
                tbody.innerHTML = '';
                
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #94A3B8;">No users connected</td></tr>';
                    return;
                }

                users.forEach(user => {
                    const row = document.createElement('tr');
                    const connectedAt = new Date(user.connected_at).toLocaleString();
                    const lastSeen = new Date(user.last_seen).toLocaleTimeString();
                    
                    row.innerHTML = `
                        <td><strong>${user.username}</strong></td>
                        <td>${connectedAt}</td>
                        <td>${lastSeen}</td>
                        <td><span class="status-badge status-online">Online</span></td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        async function createCue() {
            const name = document.getElementById('cue-name').value;
            const spoken = document.getElementById('cue-spoken').value;
            const category = document.getElementById('cue-category').value;
            const colour = document.getElementById('cue-colour').value;
            const icon = document.getElementById('cue-icon').value;
            const audioMode = document.getElementById('cue-audio-mode').value;

            if (!name) {
                showMessage('Please enter a cue name', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/cues`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        display_name: name,
                        spoken_text: spoken,
                        category,
                        button_colour: colour,
                        icon,
                        audio_mode: audioMode,
                    }),
                });

                if (res.ok) {
                    showMessage('Cue created successfully', 'success');
                    document.getElementById('cue-name').value = '';
                    document.getElementById('cue-spoken').value = '';
                    document.getElementById('cue-category').value = '';
                    loadCues();
                } else {
                    showMessage('Error creating cue', 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        async function uploadAudio() {
            const cueId = document.getElementById('cue-select').value;
            const file = document.getElementById('audio-file').files[0];

            if (!cueId) {
                showMessage('Please select a cue', 'error');
                return;
            }

            if (!file) {
                showMessage('Please select an audio file', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch(`${API_BASE}/cues/${cueId}/audio`, {
                    method: 'POST',
                    body: formData,
                });

                if (res.ok) {
                    showMessage('Audio uploaded successfully', 'success');
                    document.getElementById('audio-file').value = '';
                    document.getElementById('cue-select').value = '';
                } else {
                    showMessage('Error uploading audio', 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        async function deleteCue(cueId) {
            if (!confirm('Are you sure you want to delete this cue?')) return;

            try {
                const res = await fetch(`${API_BASE}/cues/${cueId}`, {
                    method: 'DELETE',
                });

                if (res.ok) {
                    showMessage('Cue deleted successfully', 'success');
                    loadCues();
                } else {
                    showMessage('Error deleting cue', 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        async function editCue(cueId) {
            try {
                const res = await fetch(`${API_BASE}/cues/${cueId}`);
                if (!res.ok) {
                    showMessage('Error loading cue details', 'error');
                    return;
                }
                const cue = await res.json();

                // Populate form with cue data
                document.getElementById('cue-name').value = cue.display_name;
                document.getElementById('cue-spoken').value = cue.spoken_text || '';
                document.getElementById('cue-category').value = cue.category;
                document.getElementById('cue-colour').value = cue.button_colour;
                document.getElementById('colour-preview').style.backgroundColor = cue.button_colour;
                document.getElementById('cue-icon').value = cue.icon;
                document.getElementById('cue-audio-mode').value = cue.audio_mode;

                // Change button to update
                const createBtn = document.querySelector('.btn-primary[onclick="createCue()"]');
                createBtn.textContent = 'Update Cue';
                createBtn.onclick = () => updateCue(cueId);

                showMessage('Edit mode - make changes and click Update', 'success');
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        async function updateCue(cueId) {
            const name = document.getElementById('cue-name').value;
            const spoken = document.getElementById('cue-spoken').value;
            const category = document.getElementById('cue-category').value;
            const colour = document.getElementById('cue-colour').value;
            const icon = document.getElementById('cue-icon').value;
            const audioMode = document.getElementById('cue-audio-mode').value;

            if (!name) {
                showMessage('Please enter a cue name', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/cues/${cueId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        display_name: name,
                        spoken_text: spoken,
                        category,
                        button_colour: colour,
                        icon,
                        audio_mode: audioMode,
                    }),
                });

                if (res.ok) {
                    showMessage('Cue updated successfully', 'success');
                    // Reset form
                    document.getElementById('cue-name').value = '';
                    document.getElementById('cue-spoken').value = '';
                    document.getElementById('cue-category').value = '';
                    document.getElementById('cue-colour').value = '#3B82F6';
                    document.getElementById('colour-preview').style.backgroundColor = '#3B82F6';
                    document.getElementById('cue-icon').value = 'bell';
                    document.getElementById('cue-audio-mode').value = 'automatic';
                    
                    // Reset button back to create
                    const updateBtn = document.querySelector('.btn-primary');
                    updateBtn.textContent = 'Create Cue';
                    updateBtn.onclick = createCue;
                    
                    loadCues();
                } else {
                    showMessage('Error updating cue', 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        async function checkHealth() {
            try {
                const res = await fetch(`${API_BASE}/health`);
                const data = await res.json();
                showMessage(`Health: ${data.status}`, 'success');
            } catch (error) {
                showMessage(`Health check failed: ${error.message}`, 'error');
            }
        }

        async function refreshStats() {
            await loadStats();
            await loadUsers();
            showMessage('Stats refreshed', 'success');
        }

        async function createBackup() {
            try {
                const res = await fetch(`${API_BASE}/admin/backup`, {
                    method: 'POST',
                });

                if (res.ok) {
                    const data = await res.json();
                    showMessage(`Backup created: ${data.backup_file}`, 'success');
                } else {
                    showMessage('Error creating backup', 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        function showMessage(text, type) {
            const container = document.getElementById('message-container');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            container.appendChild(message);

            setTimeout(() => message.remove(), 4000);
        }

        document.getElementById('cue-colour').addEventListener('input', (e) => {
            document.getElementById('colour-preview').style.backgroundColor = e.target.value;
        });

        // Initialize
        window.addEventListener('load', () => {
            document.getElementById('colour-preview').style.backgroundColor = '#3B82F6';
            loadStats();
            loadCues();
            loadUsers();

            // Refresh every 30 seconds
            setInterval(() => {
                loadUsers();
                loadStats();
            }, 30000);
        });
    </script>
</body>
</html>
