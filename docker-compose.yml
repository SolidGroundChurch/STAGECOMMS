version: '3.8'

services:
  stagecomms:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/database/stagecomms.db
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - LOG_LEVEL=INFO
      - UPLOAD_DIR=/app/uploads
      - LOGS_DIR=/app/logs
    volumes:
      - ./app/database:/app/database
      - ./app/uploads:/app/uploads
      - ./app/logs:/app/logs
      - ./app/static:/app/static
      - ./app/templates:/app/templates
      - ./app/frontend:/app/frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stagecomms_network

networks:
  stagecomms_network:
    driver: bridge
